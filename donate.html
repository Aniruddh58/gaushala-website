<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="donate_page_title"></title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" data-i18n="donate_meta_desc" />
  <meta name="robots" content="index, follow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="container header-inner">

    <a href="index.html" class="brand">
      <div class="brand-mark">ॐ</div>
      <div class="brand-text">
        <span class="brand-name" data-i18n="site_name"></span>
        <span class="brand-tagline" data-i18n="site_tagline"></span>
      </div>
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">☰</button>

    <div class="nav-group" id="navGroup">
      <nav class="site-nav">
        <a href="index.html" data-i18n="nav_home"></a>
        <a href="about.html" data-i18n="nav_about"></a>
        <a href="activities.html" data-i18n="nav_activities"></a>
        <a href="stories.html" data-i18n="nav_stories"></a>
        <a href="members.html" data-i18n="nav_members"></a>
        <a href="donate.html" data-i18n="nav_donate"></a>
        <a href="contact.html" data-i18n="nav_contact"></a>
      </nav>

      <select class="lang-select" data-lang-select>
        <option value="hi">हिंदी</option>
        <option value="en">English</option>
      </select>
    </div>

  </div>
</header>

<!-- ================= PAGE HEADER ================= -->
<section class="section" style="background:#fff;">
  <div class="container">
    <div class="section-title">
      <h2 data-i18n="donate_heading"></h2>
      <p data-i18n="donate_text"></p>
    </div>
  </div>
</section>

<!-- ================= DONATION DETAILS ================= -->
<section class="section">
  <div class="container">

    <div class="card-grid">

      <!-- UPI DETAILS -->
      <div class="card">
        <div class="card-body">
          <h3 data-i18n="donate_upi_title"></h3>
          <p data-i18n="donate_upi_desc"></p>

          <p style="font-size:1.1rem;font-weight:600;">
            UPI ID:<br>
            <span style="color:#C62828;">yourupiid@bank</span>
          </p>

          <p data-i18n="donate_upi_note"></p>
        </div>
      </div>

      <!-- QR CODE -->
      <div class="card">
        <div class="card-body" style="text-align:center;">
          <h3 data-i18n="donate_qr_title"></h3>

          <img
            src="assets/images/qr.jpg"
            alt="UPI QR Code"
            style="max-width:240px;margin:20px auto;display:block;">

          <p data-i18n="donate_qr_desc"></p>
        </div>
      </div>

    </div>

  </div>
</section>

<!-- ================= DONATION FORM ================= -->
<section class="section" style="background:#fff;">
  <div class="container">

    <h3 style="color:#C62828;" data-i18n="donate_form_title"></h3>
    <p data-i18n="donate_note"></p>

    <!-- Google Form Embed -->
    <iframe
      src="https://forms.gle/YOUR_DONATION_FORM"
      width="100%"
      height="800"
      frameborder="0"
      loading="lazy">
    </iframe>

  </div>
</section>

<!-- ================= CTA ================= -->
<section class="section">
  <div class="container" style="text-align:center;">
    <h3 data-i18n="donate_cta_title"></h3>
    <p data-i18n="donate_cta_text"></p>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <div class="container footer-inner">
    <p data-i18n="footer_text"></p>
  </div>
</footer>

<!-- Floating Buttons -->
<div class="fab call"><a href="tel:+919519047327">📞</a></div>
<div class="fab whatsapp"><a href="https://wa.me/919519047327" target="_blank">💬</a></div>

<script src="assets/js/main.js"></script>
</body>
</html>
